<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-label="autonomous-policy-mpc - deep reinforcement learning policy network &amp; nonlinear MPC">
  <defs>
    <linearGradient id="shim3" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cclip3"><rect x="1" y="1" width="858" height="166" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="166" rx="10" fill="#07090e" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="5" height="164" fill="#38bdf8" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Watermark Icon (Robotics Motion Path / Trajectory) -->
  <g opacity="0.08" transform="translate(690, 24) scale(2.8)" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <path d="M4,40 C14,15 30,35 44,8"/>
    <circle cx="4" cy="40" r="3" fill="#38bdf8"/>
    <circle cx="22" cy="24" r="3" fill="#38bdf8"/>
    <circle cx="44" cy="8" r="3" fill="#38bdf8"/>
  </g>

  <text x="34" y="86" font-size="46" font-weight="700" fill="#38bdf8" fill-opacity="0.14" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">03</text>

  <text x="92" y="48" font-size="22" font-weight="700" fill="#38bdf8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">autonomous-policy-mpc</text>
  <text x="92" y="70" font-size="12" fill="#94a3b8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">● github.com/CapedCrusader77/autonomous-policy-mpc</text>

  <text x="92" y="96" font-size="13" fill="#f1f5f9" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">deep reinforcement learning policy network paired with nonlinear MPC controller.</text>
  <text x="92" y="114" font-size="13" fill="#94a3b8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">dynamic obstacle avoidance and optimal trajectory planning trained in Isaac Sim for Sim2Real transfer.</text>

  <!-- Chips -->
  <rect x="92" y="128" width="68" height="20" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="126" y="142" text-anchor="middle" font-size="11" fill="#38bdf8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">Python</text>

  <rect x="168" y="128" width="86" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="211" y="142" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">Isaac Sim</text>

  <rect x="262" y="128" width="56" height="20" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="290" y="142" text-anchor="middle" font-size="11" fill="#38bdf8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">MPC</text>

  <rect x="326" y="128" width="68" height="20" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="360" y="142" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">ROS 2</text>

  <rect x="402" y="128" width="76" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">Sim2Real</text>

  <path d="M14,16 L14,8 L26,8" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
  <path d="M846,152 L846,160 L834,160" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>

  <g clip-path="url(#cclip3)">
    <rect x="-200" y="1" width="200" height="166" fill="url(#shim3)">
      <animate attributeName="x" values="-200;860;860" keyTimes="0;0.6;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
