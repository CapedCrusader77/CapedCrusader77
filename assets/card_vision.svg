<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-label="edge-tensor-vision - sub-4ms zero-copy perception pipeline">
  <defs>
    <linearGradient id="shim2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cclip2"><rect x="1" y="1" width="858" height="166" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="166" rx="10" fill="#07090e" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="5" height="164" fill="#8b5cf6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Watermark Icon (Computer Vision Bounding Box) -->
  <g opacity="0.08" transform="translate(700, 28) scale(2.6)" stroke="#8b5cf6" stroke-width="1.2" fill="none">
    <rect x="4" y="4" width="40" height="40" rx="4"/>
    <circle cx="24" cy="24" r="8"/>
    <line x1="2" y1="24" x2="12" y2="24"/>
    <line x1="36" y1="24" x2="46" y2="24"/>
    <line x1="24" y1="2" x2="24" y2="12"/>
    <line x1="24" y1="36" x2="24" y2="46"/>
  </g>

  <text x="34" y="86" font-size="46" font-weight="700" fill="#8b5cf6" fill-opacity="0.14" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">02</text>

  <text x="92" y="48" font-size="22" font-weight="700" fill="#8b5cf6" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">edge-tensor-vision</text>
  <text x="92" y="70" font-size="12" fill="#94a3b8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">● github.com/CapedCrusader77/edge-tensor-vision</text>

  <text x="92" y="96" font-size="13" fill="#f1f5f9" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">sub-4ms zero-copy perception pipeline on NVIDIA Jetson hardware.</text>
  <text x="92" y="114" font-size="13" fill="#94a3b8" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">accelerated 3D object detection, 6-DoF pose estimation, and depth segmentation at 120 FPS.</text>

  <!-- Chips -->
  <rect x="92" y="128" width="76" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="130" y="142" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">PyTorch</text>

  <rect x="176" y="128" width="86" height="20" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="219" y="142" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">TensorRT</text>

  <rect x="270" y="128" width="62" height="20" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="301" y="142" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">CUDA</text>

  <rect x="340" y="128" width="72" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="376" y="142" text-anchor="middle" font-size="11" fill="#c4b5fd" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">OpenCV</text>

  <rect x="420" y="128" width="56" height="20" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="448" y="142" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono',monospace">FP16</text>

  <path d="M14,16 L14,8 L26,8" fill="none" stroke="#00f0ff" stroke-opacity="0.5"/>
  <path d="M846,152 L846,160 L834,160" fill="none" stroke="#00f0ff" stroke-opacity="0.5"/>

  <g clip-path="url(#cclip2)">
    <rect x="-200" y="1" width="200" height="166" fill="url(#shim2)">
      <animate attributeName="x" values="-200;860;860" keyTimes="0;0.6;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
